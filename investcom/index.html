async function go(){
  const pw = document.getElementById('pw').value;
  try {
    const enc = new TextEncoder();
    const salt = Uint8Array.from(atob(PAYLOAD.salt), c=>c.charCodeAt(0));
    const nonce = Uint8Array.from(atob(PAYLOAD.nonce), c=>c.charCodeAt(0));
    const ct = Uint8Array.from(atob(PAYLOAD.ct), c=>c.charCodeAt(0));
    const baseKey = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);

      baseKey, {name:'AES-GCM', length:256}, false, ['decrypt']

    const html = new TextDecoder().decode(pt);
    document.open(); document.write(html); document.close();

    document.getElementById('err').textContent = 'Неверный пароль';
  }
