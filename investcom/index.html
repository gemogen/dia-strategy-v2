  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(DATA.iv)},key,b(DATA.ct));
  return new TextDecoder().decode(pt)}
async function open_(pw,silent){
  try{const html=await dec(pw);sessionStorage.setItem('ikpw',pw);
    document.open();document.write(html);document.close()}
  catch(e){if(!silent)document.getElementById('err').textContent='Неверный пароль'}}
document.getElementById('go').onclick=()=>open_(document.getElementById('pw').value,false);
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')open_(e.target.value,false)});
const c=sessionStorage.getItem('ikpw');if(c)open_(c,true);
</script>
