async function tryDecrypt(){
  const pw = document.getElementById('pw').value;
  const err = document.getElementById('err');
  err.textContent = '';
  try{
    const salt = Uint8Array.from(atob(PAYLOAD.salt), c=>c.charCodeAt(0));
    const iv = Uint8Array.from(atob(PAYLOAD.iv), c=>c.charCodeAt(0));
    const ct = Uint8Array.from(atob(PAYLOAD.ct), c=>c.charCodeAt(0));
    const baseKey = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      {name:'PBKDF2', salt, iterations: PAYLOAD.iter, hash:'SHA-256'},
      baseKey, {name:'AES-GCM', length:256}, false, ['decrypt']
    );
    const plainBuf = await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, ct);
    const html = new TextDecoder().decode(plainBuf);
    document.open(); document.write(html); document.close();
  }catch(e){
    err.textContent = 'Неверный пароль';
  }
}
document.getElementById('go').addEventListener('click', tryDecrypt);
document.getElementById('pw').addEventListener('keydown', e=>{ if(e.key==='Enter') tryDecrypt(); });
