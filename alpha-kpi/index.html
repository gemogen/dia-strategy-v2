<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Сколько альфы достаточно — Аналитическая дирекция</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Spectral:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0C1322; --ink-2:#13203A; --navy:#1B2A52; --navy-soft:#22325E;
  --paper:#F4F5F7; --card:#FFFFFF; --amber:#D9952A; --amber-bright:#EBA838;
  --teal:#138A7E; --teal-soft:#E4F1EF; --ink-text:#0E1626; --slate:#586079;
  --slate-light:#8A93A8; --line:#E4E7EC; --good:#1F9D6B; --bad:#D45B5B;
  --on-dark:#EEF1F6; --on-dark-mute:#94A2BE;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{font-family:'Inter',sans-serif;background:var(--ink);color:var(--ink-text);overflow:hidden;}

/* ---------- password gate ---------- */
#gate{position:fixed;inset:0;background:var(--ink);color:var(--on-dark);display:flex;align-items:center;justify-content:center;z-index:9999;flex-direction:column;gap:18px;}
#gate .gk{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.12em;color:var(--amber);text-transform:uppercase;}
#gate h2{font-size:22px;font-weight:700;}
#gate input{background:var(--ink-2);border:1px solid var(--navy-soft);color:var(--on-dark);padding:12px 16px;border-radius:8px;font-size:15px;width:280px;font-family:'IBM Plex Mono',monospace;}
#gate input:focus{outline:none;border-color:var(--amber);}
#gate button{background:var(--amber);color:var(--ink);border:none;padding:12px 22px;border-radius:8px;font-weight:700;cursor:pointer;font-size:14px;}
#gate button:hover{background:var(--amber-bright);}
#gate .err{color:var(--bad);font-size:13px;height:16px;font-family:'IBM Plex Mono',monospace;}
#app{display:none;height:100%;}

/* ---------- slides ---------- */
.slide{position:absolute;inset:0;width:100%;height:100%;display:none;overflow:hidden;}
.slide.active{display:block;}
.slide.light{background:var(--paper);color:var(--ink-text);}
.slide.dark{background:var(--ink);color:var(--on-dark);}
.slide-inner{position:relative;z-index:2;max-width:1360px;margin:0 auto;padding:0 64px;height:100%;display:flex;flex-direction:column;justify-content:center;}
.grid-bg{position:absolute;inset:0;background-image:linear-gradient(rgba(238,241,246,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(238,241,246,.05) 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:radial-gradient(ellipse at 70% 30%,black 0%,transparent 70%);mask-image:radial-gradient(ellipse at 70% 30%,black 0%,transparent 70%);}

.kicker{font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.14em;color:var(--amber);text-transform:uppercase;margin-bottom:18px;opacity:0;transform:translateY(10px);}
.kicker-light{color:var(--teal);}

.title-inner h1{font-size:64px;line-height:1.04;font-weight:800;letter-spacing:-.02em;margin-bottom:22px;opacity:0;transform:translateY(16px);color:var(--on-dark);}
.tagline{font-family:'Spectral',serif;font-style:italic;font-size:22px;color:var(--on-dark-mute);margin-bottom:48px;opacity:0;transform:translateY(12px);}
.cursor{display:inline-block;width:10px;height:22px;background:var(--amber);margin-left:4px;vertical-align:-4px;animation:blink 1s step-end infinite;}
@keyframes blink{50%{opacity:0;}}

.hero-metrics{display:flex;gap:56px;margin-bottom:36px;}
.hm{opacity:0;transform:translateY(14px);}
.hm-n{font-family:'IBM Plex Mono',monospace;font-size:44px;font-weight:600;color:var(--amber-bright);}
.hm-d{font-size:13px;color:var(--on-dark-mute);margin-top:6px;max-width:220px;line-height:1.4;}
.hero-foot{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--on-dark-mute);opacity:0;letter-spacing:.04em;}

.head-row{font-size:44px;font-weight:800;letter-spacing:-.015em;margin-bottom:10px;opacity:0;transform:translateY(14px);}
.sub{font-size:16px;color:var(--slate);margin-bottom:40px;max-width:920px;opacity:0;transform:translateY(10px);line-height:1.5;}
.sub-dark{color:var(--on-dark-mute);}

.cards{display:grid;gap:22px;}
.cards-3{grid-template-columns:repeat(3,1fr);}

.scard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:26px 24px;opacity:0;transform:translateY(18px);box-shadow:0 1px 2px rgba(12,19,34,.04);}
.scard-dark{background:var(--navy-soft);border:1px solid rgba(255,255,255,.08);}
.sc-tag{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;color:var(--teal);font-weight:600;margin-bottom:14px;}
.scard-dark .sc-tag{color:var(--amber-bright);font-size:26px;font-family:'IBM Plex Mono',monospace;}
.sc-big{font-family:'IBM Plex Mono',monospace;font-size:26px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:10px;}
.sc-big .was{color:var(--slate-light);font-weight:500;}
.sc-big .arrow{color:var(--slate-light);font-size:18px;}
.sc-big .now{color:var(--navy);font-weight:700;}
.sc-sub{font-size:13px;line-height:1.55;color:var(--slate);margin-bottom:16px;}
.sc-sub-big{font-size:19px;line-height:1.5;color:var(--on-dark);font-weight:500;}
.sc-pill{background:var(--teal-soft);border-radius:10px;padding:12px 14px;font-size:12px;line-height:1.5;color:#0E4C46;}
.pill-tag{display:block;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;color:var(--teal);font-weight:700;margin-bottom:4px;}

.opr{background:var(--navy-soft);border-radius:14px;padding:24px 22px;opacity:0;transform:translateY(18px);}
.opr-tag{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;color:var(--amber-bright);font-weight:600;margin-bottom:8px;}
.opr-row{margin-bottom:6px;}
.opr-was{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--on-dark-mute);}
.opr-n{font-family:'IBM Plex Mono',monospace;font-size:46px;font-weight:600;color:var(--on-dark);line-height:1;}
.opr-unit{font-size:22px;color:var(--on-dark-mute);}
.cl-track{height:6px;background:rgba(255,255,255,.1);border-radius:4px;margin:14px 0 16px;overflow:hidden;}
.cl-fill{height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--amber-bright));border-radius:4px;transition:width 1s cubic-bezier(.2,.7,.2,1);}
.calc{font-family:'IBM Plex Mono',monospace;font-size:11px;line-height:1.7;color:var(--on-dark-mute);background:rgba(255,255,255,.04);border-radius:8px;padding:10px 12px;margin-bottom:14px;}
.opr-desc{font-size:12.5px;line-height:1.55;color:var(--on-dark-mute);}

.fn-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;}
.fn-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;opacity:0;transform:translateY(16px);}
.fn-ico{width:36px;height:36px;border-radius:50%;background:var(--teal-soft);color:var(--teal);display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-weight:700;margin-bottom:14px;}
.ft{font-size:16px;font-weight:700;margin-bottom:8px;}
.fd{font-size:13px;line-height:1.55;color:var(--slate);}

/* enter animation trigger */
.slide.active .kicker,.slide.active .head-row,.slide.active .sub,.slide.active h1,.slide.active .tagline,.slide.active .hero-foot,
.slide.active .hm,.slide.active .scard,.slide.active .opr,.slide.active .fn-card{animation:enter .6s cubic-bezier(.2,.7,.2,1) forwards;}
.slide.active .kicker{animation-delay:.05s;}
.slide.active h1{animation-delay:.12s;}
.slide.active .tagline{animation-delay:.22s;}
.slide.active .head-row{animation-delay:.1s;}
.slide.active .sub{animation-delay:.2s;}
.slide.active .hero-foot{animation-delay:.55s;}
.slide.active .hm:nth-child(1){animation-delay:.3s;}
.slide.active .hm:nth-child(2){animation-delay:.4s;}
.slide.active .hm:nth-child(3){animation-delay:.5s;}
.slide.active .scard:nth-child(1),.slide.active .opr:nth-child(1),.slide.active .fn-card:nth-child(1){animation-delay:.28s;}
.slide.active .scard:nth-child(2),.slide.active .opr:nth-child(2),.slide.active .fn-card:nth-child(2){animation-delay:.38s;}
.slide.active .scard:nth-child(3),.slide.active .opr:nth-child(3),.slide.active .fn-card:nth-child(3){animation-delay:.48s;}
.slide.active .fn-card:nth-child(4){animation-delay:.58s;}
@keyframes enter{to{opacity:1;transform:translateY(0);}}

/* build badge */
#badge{position:fixed;top:22px;right:26px;z-index:50;background:rgba(12,19,34,.72);color:var(--on-dark-mute);font-family:'IBM Plex Mono',monospace;font-size:11px;padding:6px 12px;border-radius:20px;letter-spacing:.03em;backdrop-filter:blur(4px);}

/* progress */
#progress{position:fixed;top:0;left:0;height:3px;background:var(--amber);z-index:60;transition:width .3s;}

/* HUD */
#hud{position:fixed;bottom:22px;right:26px;z-index:50;display:flex;align-items:center;gap:6px;background:rgba(12,19,34,.72);border-radius:24px;padding:6px 8px;backdrop-filter:blur(4px);}
#hud button{width:30px;height:30px;border-radius:50%;border:none;background:rgba(255,255,255,.08);color:var(--on-dark);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;}
#hud button:hover{background:var(--amber);color:var(--ink);}
#hud .cnt{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--on-dark-mute);padding:0 8px;min-width:52px;text-align:center;}

@media print{
  #hud,#progress,#badge{display:none!important;}
  .slide{position:relative;display:block!important;page-break-after:always;height:100vh;}
}
</style>
</head>

<script id="saltiv" type="application/json">{"salt":"66QXDpk/KfjX/lSq8DKlOg==","iv":"lDiv+uv+bUHG/wpm"}</script>

<script>
(function(){
  var b64ToBuf = function(b64){ var bin = atob(b64); var arr = new Uint8Array(bin.length); for (var i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i); return arr.buffer; };

  async function deriveKey(password, saltBuf){
    var enc = new TextEncoder();
    var baseKey = await crypto.subtle.importKey('raw', enc.encode(password), {name:'PBKDF2'}, false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      {name:'PBKDF2', salt: saltBuf, iterations: 250000, hash:'SHA-256'},
      baseKey, {name:'AES-GCM', length:256}, false, ['decrypt']
    );
  }

  async function tryDecrypt(password){
    var meta = JSON.parse(document.getElementById('saltiv').textContent);
    var salt = b64ToBuf(meta.salt);
    var iv = b64ToBuf(meta.iv);
    var payload = b64ToBuf(document.getElementById('payload').textContent.trim());
    var key = await deriveKey(password, salt);
    var plainBuf = await crypto.subtle.decrypt({name:'AES-GCM', iv: iv}, key, payload);
    return new TextDecoder().decode(plainBuf);
  }

  var SLIDE_COUNT = 2;
  var current = 1;

  function initSlides(html){
    document.getElementById('slides').innerHTML = html;
    document.getElementById('gate').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    var hash = parseInt(location.hash.replace('#',''),10);
    current = (hash && hash>=1 && hash<=SLIDE_COUNT) ? hash : 1;
    render();
    bindNav();
  }

  function render(){
    var slides = document.querySelectorAll('.slide');
    slides.forEach(function(s,i){ s.classList.toggle('active', i === current-1); });
    document.getElementById('cnt').textContent = current + ' / ' + SLIDE_COUNT;
    document.getElementById('progress').style.width = (current/SLIDE_COUNT*100) + '%';
    location.hash = '#' + current;
    setTimeout(function(){
      var active = document.querySelector('.slide.active');
      if(!active) return;
      active.querySelectorAll('.cl-fill').forEach(function(f){ f.style.width = f.getAttribute('data-w') + '%'; });
    }, 50);
  }

  function go(n){
    current = Math.min(Math.max(n,1), SLIDE_COUNT);
    render();
  }

  function bindNav(){
    document.getElementById('prev').onclick = function(){ go(current-1); };
    document.getElementById('next').onclick = function(){ go(current+1); };
    document.getElementById('reload').onclick = function(){ location.reload(); };
    window.addEventListener('keydown', function(e){
      if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){ go(current+1); e.preventDefault(); }
      else if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){ go(current-1); e.preventDefault(); }
      else if(e.key==='Home'){ go(1); }
      else if(e.key==='End'){ go(SLIDE_COUNT); }
    });
  }

  async function attempt(password){
    try{
      var html = await tryDecrypt(password);
      sessionStorage.setItem('deckpw', password);
      initSlides(html);
    }catch(e){
      document.getElementById('gerr').textContent = 'Неверный пароль';
    }
  }

  document.getElementById('gbtn').onclick = function(){ attempt(document.getElementById('gpw').value); };
  document.getElementById('gpw').addEventListener('keydown', function(e){ if(e.key==='Enter') attempt(this.value); });

  var cached = sessionStorage.getItem('deckpw');
  if(cached){ attempt(cached); }
})();
</script>
